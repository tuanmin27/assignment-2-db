{% extends "base.html" %}
{% block title %}New Order{% endblock %}
{% block content %}
<h3 class="mb-3">New Order</h3>

<form method="post">
  <div class="mb-3">
    <label class="form-label">Address</label>
    <input class="form-control" name="address" placeholder="Delivery address">
  </div>
  <div class="mb-3">
    <label class="form-label">Status</label>
    <select class="form-select" name="status">
      {% for st in status_choices %}
        <option value="{{ st }}">{{ st }}</option>
      {% endfor %}
    </select>
  </div>
  <button class="btn btn-primary">Create</button>
  <a class="btn btn-secondary" href="{{ url_for('order_list') }}">Cancel</a>
</form>
{% endblock %}
